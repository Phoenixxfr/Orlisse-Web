          <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97" />

      const Lock = ({ className }) => (

      const Tag = ({ className }) => (

      const Truck = ({ className }) => (

          <path d="M15 18H9" />

          <circle cx="17" cy="18" r="2" />

      const Compass = ({ className }) => (

      const Gift = ({ className }) => (
        <IconBase className={className}>
          <rect x="3" y="8" width="18" height="4" rx="1" />
          <path d="M12 8v13" />
          <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" />

      const Award = ({ className }) => (
        <IconBase className={className}>

      );

      // ============================================================================
      // 1. BESPOKE HAUTE PARFUMERIE CREST & WORDMARK
      // ============================================================================
      function OrlisseMonogram({ className = "w-8 h-8", variant = "light" }) {
        const strokeMain = variant === "light" ? "#E8D4D8" : "#6E1428";
        const accentFill = variant === "light" ? "#9E2440" : "#4A0E1C";
        return (
          <svg viewBox="0 0 100 100" className={className} fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon
              points="50,6 88,26 88,74 50,94 12,74 12,26"
              stroke={strokeMain}
              strokeWidth="2"
              opacity="0.75"
            />
            <polygon
              points="50,15 79,31 79,69 50,85 21,69 21,31"
              stroke={strokeMain}
              strokeWidth="1.2"
              opacity="0.4"
            />
            <circle cx="50" cy="50" r="20" stroke={strokeMain} strokeWidth="2" />
            <path
              d="M50 24 L56 44 L76 50 L56 56 L50 76 L44 56 L24 50 L44 44 Z"
              fill={accentFill}
              stroke={strokeMain}
              strokeWidth="1.2"
            />
            <circle cx="50" cy="50" r="4.5" fill="#F9F4F5" />
          </svg>
        );
      }

      function OrlisseLogo({ variant = "light", size = "md", showTagline = false }) {
        const sizeClasses =
          size === "sm" ? "text-lg" : size === "lg" ? "text-3xl" : "text-xl sm:text-2xl";
        return (
          <div className="flex items-center gap-3">
            <OrlisseMonogram
              className={size === "sm" ? "w-7 h-7" : size === "lg" ? "w-11 h-11" : "w-9 h-9"}
              variant={variant}
            />
            <div className="flex flex-col">
              <span
                className={`font-serif-editorial font-semibold tracking-[0.34em] uppercase ${sizeClasses} ${
                  variant === "light" ? "text-[#F9F4F5]" : "text-[#16060A]"
                }`}
              >
                ORLISSE
              </span>
              {showTagline && (
                <span className="text-[8.5px] font-mono tracking-[0.28em] text-[#D8B4BC] uppercase hidden sm:block">
                  Haute Parfumerie • Paris • Grasse
                </span>
              )}
            </div>
          </div>
        );
      }

      // ============================================================================
      // 2. INTERACTIVE 3D CUT-CRYSTAL EXTRAIT DE PARFUM FLACON WITH ATOMIZER MIST
      // ============================================================================
      function Interactive3DPerfumeFlacon({
        activePerfume,
        onSelectPerfume,
        perfumes,
        onAddToCart,
        onOpenSpec
      }) {
        const [tilt, setTilt] = useState({ rx: 5, ry: -14, gx: 52, gy: 36 });
        const [isSpraying, setIsSpraying] = useState(false);
        const stageRef = useRef(null);
        const sprayTimeoutRef = useRef(null);

        useEffect(() => {
          return () => {
            if (sprayTimeoutRef.current) clearTimeout(sprayTimeoutRef.current);
          };
        }, []);

        const handlePointerMove = (e) => {
          if (!stageRef.current) return;
          const rect = stageRef.current.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const normX = (clientX - rect.left) / rect.width;
          const normY = (clientY - rect.top) / rect.height;
          const x = normX - 0.5;
          const y = normY - 0.5;
          setTilt({
            rx: Math.max(-15, Math.min(15, -y * 25)),
            ry: Math.max(-26, Math.min(26, x * 42)),
            gx: Math.round(normX * 100),
            gy: Math.round(normY * 100)
          });
        };

        const resetTilt = () => setTilt({ rx: 5, ry: -14, gx: 52, gy: 36 });

        const triggerAtomizerMist = () => {
          if (sprayTimeoutRef.current) clearTimeout(sprayTimeoutRef.current);
          setIsSpraying(true);
          sprayTimeoutRef.current = setTimeout(() => {
            setIsSpraying(false);
            sprayTimeoutRef.current = null;
          }, 1100);
        };

        return (
          <div className="relative w-full flex flex-col items-center justify-center">
            <div
              ref={stageRef}
              onMouseMove={handlePointerMove}
              onTouchMove={handlePointerMove}
              onTouchEnd={resetTilt}
              onMouseLeave={resetTilt}
              className="relative w-full min-h-[580px] sm:min-h-[670px] lg:min-h-[720px] rounded-3xl bg-gradient-to-b from-[#1F070E] via-[#090305] to-[#16050A] border border-[#9E2440]/35 overflow-hidden flex flex-col items-center justify-between p-5 sm:p-8 select-none cursor-grab active:cursor-grabbing shadow-[0_40px_130px_rgba(0,0,0,0.98)]"
            >
              <div
                className="pointer-events-none absolute inset-0 transition-opacity duration-300"
                style={{
                  background: `radial-gradient(circle at ${tilt.gx}% ${tilt.gy}%, rgba(178,36,69,0.34) 0%, ${activePerfume.accentHex}35 28%, rgba(8,3,5,0) 68%)`
                }}
              />

              <div
                className="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-[520px] h-[220px] rounded-full opacity-[0.35] blur-2xl"
                style={{
                  background: `radial-gradient(ellipse, ${activePerfume.liquidHex} 0%, transparent 70%)`
                }}
              />

              <div className="relative z-20 w-full flex flex-wrap items-center justify-between gap-2 text-[10px] sm:text-xs font-mono uppercase tracking-[0.22em] text-[#E5C6CD]">
                <span className="px-3.5 py-1.5 rounded-full bg-[#240811]/85 border border-[#9E2440]/45 flex items-center gap-2 shadow-lg">
                  <span className="w-2 h-2 rounded-full bg-[#E11D48] animate-pulse" />
                  <span>
                    {activePerfume.concentration} • {activePerfume.oilPercentage}% Pure Essence • Macerated {activePerfume.macerationWeeks} Weeks
                  </span>
                </span>

                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={triggerAtomizerMist}
                    className="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-[#801830] to-[#A62442] hover:from-[#981D3A] hover:to-[#BA2B4C] text-[#F9F4F5] border border-[#F2D5DC]/40 font-semibold tracking-[0.18em] flex items-center gap-1.5 cursor-pointer shadow-[0_0_25px_rgba(166,36,66,0.6)] transition-all"
                  >
                    <Sparkles className="w-3.5 h-3.5 text-[#F9F4F5]" />
                    <span>Press to Atomize Mist</span>
                  </button>
                </div>
              </div>

              <div className="pointer-events-none absolute inset-0 flex flex-col items-center justify-center overflow-hidden z-0">
                <div
                  className="font-serif-editorial font-semibold uppercase leading-none tracking-[0.26em] text-transparent bg-clip-text bg-gradient-to-b from-[#F9F4F5]/20 via-[#A62442]/16 to-transparent select-none whitespace-nowrap transition-transform duration-200"
                  style={{
                    fontSize: "clamp(4.8rem, 17vw, 15.8rem)",
                    transform: `translate3d(${tilt.ry * -0.95}px, ${tilt.rx * 0.95}px, -70px)`
                  }}
                >
                  ORLISSE
                </div>
                <div
                  className="font-mono text-[10px] sm:text-xs uppercase tracking-[0.55em] text-[#E5C6CD]/45 mt-3 text-center px-4"
                  style={{
                    transform: `translate3d(${tilt.ry * -0.45}px, ${tilt.rx * 0.45}px, -30px)`
                  }}
                >
                  HAUTE PARFUMERIE • {activePerfume.olfactoryFamily} • {activePerfume.keyNotesSummary}
                </div>
              </div>

              <div className="relative z-10 my-auto flex flex-col items-center justify-center py-4">
                {isSpraying && (
                  <div className="pointer-events-none absolute -top-8 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center">
                    <div
                      className="w-64 h-36 rounded-full blur-xl animate-ping opacity-[0.65]"
                      style={{
                        background:
                          "radial-gradient(circle, rgba(255,235,240,0.85) 0%, rgba(190,45,78,0.45) 45%, transparent 75%)"
                      }}
                    />
                    <span className="mt-1 px-3 py-0.5 rounded-full bg-black/80 border border-[#E5C6CD]/40 text-[9px] font-mono uppercase tracking-[0.25em] text-[#F9F4F5]">
                      Olfactory Top Notes Released: {activePerfume.pyramid.top.join(" • ")}
                    </span>
                  </div>
                )}

                <div className="animate-float-slow">
                  <div
                    className="relative flex flex-col items-center transition-transform duration-150 ease-out will-change-transform"
                    style={{
                      transform: `perspective(1500px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg)`,
                      transformStyle: "preserve-3d"
                    }}
                  >
                    <div className="relative flex flex-col items-center">
                      <div
                        className="w-20 sm:w-24 h-2.5 rounded-t-sm border-t border-x border-white/40"
                        style={{
                          background: `linear-gradient(${90 + tilt.ry * 1.5}deg, #3A2F34 0%, #E8D4D8 48%, #24191E 100%)`
                        }}
                      />
                      <div
                        className="relative w-24 sm:w-28 h-16 sm:h-[72px] rounded-sm border border-white/25 shadow-[0_14px_30px_rgba(0,0,0,0.95)] overflow-hidden flex items-center justify-center"
                        style={{
                          background: `linear-gradient(${105 + tilt.ry * 1.4}deg, #090406 0%, #2B0913 32%, #68162B 50%, #120509 74%, #050203 100%)`
                        }}
                      >
                        <div className="absolute inset-y-0 left-3 w-px bg-white/20" />
                        <div className="absolute inset-y-0 right-3 w-px bg-white/15" />
                        <div
                          className="pointer-events-none absolute inset-y-0 w-7 bg-gradient-to-r from-transparent via-white/35 to-transparent -skew-x-12"
                          style={{ left: `${25 + tilt.ry * 1.3}%` }}
                        />
                        <span className="font-serif-editorial text-[9px] tracking-[0.38em] text-[#E8D4D8]/90 uppercase font-semibold">
                          ORLISSE
                        </span>
                      </div>

                      <div
                        className="relative w-14 sm:w-16 h-6 border-x border-b border-white/40 shadow-lg flex items-center justify-center"
                        style={{
                          background: `linear-gradient(${90 + tilt.ry * 1.8}deg, #2D2327 0%, #F5E6E9 35%, #8F757C 62%, #1F171A 100%)`
                        }}
                      >
                        <div className="w-2.5 h-2.5 rounded-full bg-[#120408] border border-white/60 shadow-inner" />
                      </div>

                      <div
                        className="w-[72px] sm:w-20 h-2.5 rounded-t-sm border-x border-white/30"
                        style={{
                          background: "linear-gradient(90deg, #1E080E 0%, #9E2440 50%, #1E080E 100%)"
                        }}
                      />
                    </div>

                    <div
                      className="relative w-52 sm:w-60 h-72 sm:h-80 rounded-t-[26px] rounded-b-[18px] border border-white/35 p-4 flex flex-col justify-between overflow-hidden"
                      style={{
                        background: `linear-gradient(${115 + tilt.ry}deg, #080204 0%, #2E0814 22%, ${activePerfume.liquidHex} 52%, #1A040B 82%, #050103 100%)`,
                        boxShadow: `${-tilt.ry * 1.35}px ${30 + tilt.rx}px 75px rgba(0,0,0,0.98), inset 0 0 32px rgba(255,220,230,0.22), inset 10px 0 26px rgba(255,255,255,0.28), inset -14px 0 32px rgba(0,0,0,0.9)`
                      }}
                    >
                      <div
                        className="pointer-events-none absolute inset-x-3 bottom-5 top-8 rounded-2xl opacity-[0.85] transition-transform duration-200"
                        style={{
                          background: `radial-gradient(ellipse at ${50 - tilt.ry * 0.7}% ${55 - tilt.rx * 0.7}%, ${activePerfume.glowHex} 0%, ${activePerfume.liquidHex} 48%, rgba(10,2,5,0.96) 92%)`,
                          boxShadow: "inset 0 2px 18px rgba(255,215,225,0.35)"
                        }}
                      />

                      <div
                        className="pointer-events-none absolute left-4 right-4 top-8 h-2 rounded-full bg-gradient-to-r from-transparent via-rose-200/60 to-transparent"
                        style={{
                          transform: `rotateZ(${-tilt.ry * 0.18}deg)`
                        }}
                      />

      function ensureThreeDistinctProductIds(ids) {
        const defaults = ["orl-velours-minuit", "orl-santal-imperial", "orl-ambre-brule"];

        if (Array.isArray(ids)) {
          ids.forEach((id) => {
            if (PRODUCTS.some((p) => p.id === id) && !validUnique.includes(id)) {
              validUnique.push(id);
            }
          });
        }
        for (const defId of defaults) {
          if (validUnique.length >= 3) break;
          if (!validUnique.includes(defId)) validUnique.push(defId);

        for (const prod of PRODUCTS) {
          if (validUnique.length >= 3) break;
          if (!validUnique.includes(prod.id)) validUnique.push(prod.id);
        }
        return validUnique.slice(0, 3);
      }

      function useModalA11y(isOpen, onClose, modalRef) {
        const onCloseRef = useRef(onClose);
        const previousFocusRef = useRef(null);

        useEffect(() => {
          onCloseRef.current = onClose;
        }, [onClose]);

        useEffect(() => {
          if (!isOpen) return;
          previousFocusRef.current = document.activeElement;
          const originalOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";

          const focusableSelector =
            'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

          const focusTimer = setTimeout(() => {
            if (modalRef?.current) {
              const focusable = modalRef.current.querySelectorAll(focusableSelector);
              if (focusable.length > 0) {
                focusable[0].focus();
              }
            }
          }, 10);

          const handleKeyDown = (e) => {
            if (e.key === "Escape" && onCloseRef.current) {
              onCloseRef.current();
              return;
            }
            if (e.key === "Tab" && modalRef?.current) {
              const focusable = modalRef.current.querySelectorAll(focusableSelector);
              if (focusable.length === 0) return;
              const first = focusable[0];
              const last = focusable[focusable.length - 1];
              if (e.shiftKey) {
                if (document.activeElement === first || !modalRef.current.contains(document.activeElement)) {
                  e.preventDefault();
                  last.focus();
                }
              } else {
                if (document.activeElement === last || !modalRef.current.contains(document.activeElement)) {
                  e.preventDefault();
                  first.focus();
                }
              }
            }
          };

          window.addEventListener("keydown", handleKeyDown);
          return () => {
            clearTimeout(focusTimer);
            document.body.style.overflow = originalOverflow;
            window.removeEventListener("keydown", handleKeyDown);
            if (previousFocusRef.current && typeof previousFocusRef.current.focus === "function") {
              previousFocusRef.current.focus();
            }
          };
        }, [isOpen, modalRef]);
      }

          );

          const totalQuantity = hydratedList.reduce((sum, item) => sum + item.quantity, 0);
          const qualifiesForCoffretBundle = totalQuantity >= 3;

          let bundleDiscountINR = 0;

          const afterBundleINR = subtotalINR - bundleDiscountINR;

          let voucherDiscountINR = 0;
          const voucherObj = voucherCode ? PROMO_VOUCHERS[voucherCode] : null;
          if (voucherObj && afterBundleINR >= voucherObj.minOrder) {

          const discountedSubtotalINR = Math.max(0, afterBundleINR - voucherDiscountINR);
          const remainingForFreeShippingINR = Math.max(
            0,
            FREE_SHIPPING_THRESHOLD - discountedSubtotalINR

          const isFreeShippingUnlocked =
            hydratedList.length > 0 && remainingForFreeShippingINR === 0;
          const shippingFeeINR =
            hydratedList.length === 0 || isFreeShippingUnlocked ? 0 : DEMO_SHIPPING_FEE;

            discountINR: bundleDiscountINR,

                          key={m.id}
                          onClick={() => setActiveMood(m.id)}
                          className={`px-3.5 py-2 rounded-full border font-medium ${
                            activeMood === m.id
                              ? "bg-[#6E1428] text-[#F9F4F5] border-[#E5C6CD]/50"
                              : "bg-[#090205] text-[#F9F4F5]/75 border-[#9E2440]/30"
                          }`}
                        >
                          {m.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 pt-1">
                    <button
                      type="button"
                      onClick={() => {
                        setActiveCategory("all");
                        setActiveMood("all");
                      }}
                      className="w-full py-2.5 rounded-full border border-[#9E2440]/45 text-xs uppercase tracking-wider font-semibold text-[#E5C6CD]"
                    >
                      Clear filters
                    </button>
                    <button
                      type="button"
                      onClick={() => setMobileFilterSheetOpen(false)}
                      className="w-full py-2.5 rounded-full bg-gradient-to-r from-[#6E1428] to-[#9E2440] text-xs uppercase tracking-wider font-semibold text-[#F9F4F5]"
                    >
                      Show {filteredCatalog.length} {filteredCatalog.length === 1 ? "creation" : "creations"}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
